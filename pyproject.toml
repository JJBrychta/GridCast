[project]
name = "racecast"
version = "0.1.0"
description = "F1 data scraping + race-result prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.6.0",
    "ipykernel>=7.3.0",
    "pandas-stubs~=2.3.3",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
