[project]
name = "racecast"
version = "0.1.0"
description = "F1 data scraping + race-result prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "fastf1>=3.6.0",
    "ipykernel>=7.3.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src", "tests"]
markers = [
    "network: hits the real FastF1 / Ergast API (run with --run-network)",
]

[tool.coverage.run]
source = ["racecast"]
omit = ["*/ingest/pipeline.py"]  # thin CLI entrypoint

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise AssertionError\\(.unreachable.\\)",
]
